name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the toolchain and its components.
      - run: rustup show active-toolchain
      # The desktop app (Slint, winit backend) needs these system packages
      # on Linux. The CLI does not need them.
      - name: Install the system packages of the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: ./scripts/check-guards.sh
      - name: The CLI does not depend on Slint
        run: |
          cargo tree -p inkland-cli --locked --target all -e normal,build,dev --prefix none > cli-tree.txt
          if grep -Ei 'slint' cli-tree.txt; then
            echo "inkland-cli depends on Slint"
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      # The desktop app (Slint, winit backend) needs these system packages
      # on Linux. The CLI does not need them.
      - name: Install the system packages of the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --locked -p inkland-cli --target x86_64-unknown-linux-musl
      - name: The binary is static
        run: |
          bin=target/x86_64-unknown-linux-musl/release/inkland
          file "$bin"
          file "$bin" | grep -q 'static'
          if ldd "$bin" 2>&1 | grep -q '=>'; then echo "the binary links to shared libraries"; exit 1; fi
      - name: The binary runs
        run: |
          bin=target/x86_64-unknown-linux-musl/release/inkland
          "$bin" version --json
          "$bin" generate --config fixtures/configs/full.json --dry-run > /dev/null
      - name: A 20000-cell world with one variant takes less than 2 s
        run: |
          bin=target/x86_64-unknown-linux-musl/release/inkland
          start=$(date +%s%N)
          "$bin" generate --config fixtures/configs/full.json --cells 20000 --variant ostrey-then --out-dir perf-out > /dev/null
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "generate took ${ms} ms"
          test "$ms" -lt 2000
      - uses: actions/upload-artifact@v4
        with:
          name: inkland-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/inkland
