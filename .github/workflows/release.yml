name: release

# A tag `v*` builds the command line tool and the desktop app for each
# platform and puts the packages in a GitHub release. A manual run builds
# the packages only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p inkland-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version=$(cargo pkgid -p inkland-cli | sed 's/.*[#@]//')
          name="inkland-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin=inkland
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin=inkland.exe; fi
          cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md README.md "dist/$name/"
          # The binary holds charge files under the GNU FDL, which needs its text.
          cp crates/inkland-render/assets/emblems/GFDL-1.3.txt "dist/$name/"
          mkdir -p "dist/$name/docs"
          cp docs/CLI.md docs/CONFIG.md docs/ERRORS.md "dist/$name/docs/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=dist/$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: The packaged binary runs
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/inkland
          "$bin" version --json
          "$bin" generate --config fixtures/configs/full.json --dry-run > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app links the system libraries of the window, so Linux uses
          # glibc. Ubuntu 22.04 gives an old glibc that more systems have.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the system packages of the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p inkland-app --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version=$(cargo pkgid -p inkland-app | sed 's/.*[#@]//')
          name="inkland-app-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin=inkland-app
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin=inkland-app.exe; fi
          cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md README.md "dist/$name/"
          cp crates/inkland-render/assets/emblems/GFDL-1.3.txt "dist/$name/"
          # The app holds the FMG icon font under the SIL Open Font License.
          cp crates/inkland-app/ui/fonts/OFL.txt "dist/$name/"
          mkdir -p "dist/$name/docs"
          cp docs/APP.md docs/CONFIG.md docs/ERRORS.md "dist/$name/docs/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=dist/$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
