# The output of inkland must be the same on each machine.
# Platform math functions can give different results on different systems.
# Use the functions of the libm crate.
disallowed-methods = [
  { path = "f64::sin", reason = "use libm::sin" },
  { path = "f64::cos", reason = "use libm::cos" },
  { path = "f64::tan", reason = "use libm::tan" },
  { path = "f64::asin", reason = "use libm::asin" },
  { path = "f64::acos", reason = "use libm::acos" },
  { path = "f64::atan", reason = "use libm::atan" },
  { path = "f64::atan2", reason = "use libm::atan2" },
  { path = "f64::exp", reason = "use libm::exp" },
  { path = "f64::ln", reason = "use libm::log" },
  { path = "f64::log10", reason = "use libm::log10" },
  { path = "f64::log2", reason = "use libm::log2" },
  { path = "f64::powf", reason = "use libm::pow" },
  { path = "f64::hypot", reason = "use libm::hypot" },
  { path = "f64::mul_add", reason = "fused multiply-add changes the result" },
  { path = "f32::mul_add", reason = "fused multiply-add changes the result" },
]
# The iteration order of a hash map changes from run to run.
disallowed-types = [
  { path = "std::collections::HashMap", reason = "use BTreeMap or IndexMap" },
  { path = "std::collections::HashSet", reason = "use BTreeSet or IndexSet" },
]
