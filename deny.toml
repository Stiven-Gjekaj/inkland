# cargo-deny: the rules for dependencies.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Licenses that agree with MIT OR Apache-2.0 for a binary that we
# distribute. Add a license only when a new dependency needs it.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
