<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" role="img" aria-label="inkland">
  <title>inkland</title>
  <defs>
    <!-- Deep sea ink through to the sepia of an old map. -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="0.45" stop-color="#2f5d8a"/>
      <stop offset="0.8" stop-color="#7a5a3a"/>
      <stop offset="1" stop-color="#a0703f"/>
    </linearGradient>
  </defs>
  <!-- The rose and the word are centered on the canvas, on the visible
       edges that Chrome draws with Georgia Italic. The middle of the word
       is on the middle line of the rose. -->
  <!-- A compass rose: four long points and four short points. -->
  <g transform="translate(167.75 90)">
    <circle r="62" fill="none" stroke="#a0703f" stroke-width="2"/>
    <circle r="54" fill="none" stroke="#a0703f" stroke-width="1" stroke-dasharray="3 4"/>
    <g fill="url(#ink)">
      <path d="M0,-74 L10,-10 L0,0 Z"/>
      <path d="M0,74 L-10,10 L0,0 Z"/>
      <path d="M74,0 L10,10 L0,0 Z"/>
      <path d="M-74,0 L-10,-10 L0,0 Z"/>
    </g>
    <g fill="#d9c7a3" stroke="#1e3a5f" stroke-width="1">
      <path d="M0,-74 L-10,-10 L0,0 Z"/>
      <path d="M0,74 L10,10 L0,0 Z"/>
      <path d="M74,0 L10,-10 L0,0 Z"/>
      <path d="M-74,0 L-10,10 L0,0 Z"/>
    </g>
    <g fill="#7a5a3a" transform="rotate(45)">
      <path d="M0,-44 L6,-6 L0,0 L-6,-6 Z"/>
      <path d="M0,44 L6,6 L0,0 L-6,6 Z"/>
      <path d="M44,0 L6,6 L0,0 L6,-6 Z"/>
      <path d="M-44,0 L-6,6 L0,0 L-6,-6 Z"/>
    </g>
    <circle r="5" fill="#f2e8d5" stroke="#1e3a5f" stroke-width="1.5"/>
  </g>
  <text x="267.75" y="131.6" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="112" font-style="italic" letter-spacing="2" fill="url(#ink)">inkland</text>
</svg>
