[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Stiven-Gjekaj/inkland"
authors = ["Stiven Gjekaj"]
publish = false

[workspace.dependencies]
inkland-core = { path = "crates/inkland-core" }
inkland-constraints = { path = "crates/inkland-constraints" }
inkland-io = { path = "crates/inkland-io" }
inkland-render = { path = "crates/inkland-render" }
inkland-edit = { path = "crates/inkland-edit" }
inkland = { path = "crates/inkland" }
rand_chacha = "0.10"
rand_core = "0.10"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde_path_to_error = "0.1"
clap = { version = "4", features = ["derive"] }
delaunator = "1.1"
libm = "0.2"
flate2 = "1"
proptest = "1"
roxmltree = "0.21"
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
