[package]
name = "inkland-app"
description = "The inkland desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The app code is GPL-3.0-or-later. The app binary links Slint under its
# GPL-3.0-only option, so an app binary is GPL-3.0.
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The workspace lints, but `unsafe_code` is `deny`, not `forbid`. The code
# that Slint generates has unsafe blocks, and only the `ui` module in
# `src/main.rs` allows them. The guard script checks that no other app
# code uses `unsafe`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

[dependencies]
inkland = { workspace = true, features = ["png"] }
inkland-core.workspace = true
inkland-render = { workspace = true, features = ["png"] }
serde_json.workspace = true
libm.workspace = true
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
# The winit backend with the FemtoVG (OpenGL) renderer and the software
# renderer as a fallback. No system tray.
slint = { version = "1.18", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-femtovg",
  "renderer-software",
  "accessibility",
] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
ttf-parser.workspace = true
