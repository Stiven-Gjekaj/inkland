[package]
name = "inkland-render"
description = "SVG writer, print-safe styles, label placement, and SVG checks for inkland."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The PNG preview. The CLI turns it on.
png = ["dep:resvg"]

[dependencies]
inkland-core.workspace = true
libm.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
resvg = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
# The tests of colour mode render each layer with resvg.
resvg.workspace = true
proptest.workspace = true
# Only for examples/font_metrics.rs.
skrifa = "0.49"
