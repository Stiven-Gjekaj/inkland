[package]
name = "inkland-cli"
description = "The inkland command line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "inkland"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
inkland = { workspace = true, features = ["png"] }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
jsonschema = { version = "0.61", default-features = false }
